<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Submit Quote | Immediate Painters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial,sans-serif; max-width:1100px; margin:0 auto; padding:20px; background:#0f0f0f; color:#fff; }
    h1 { color:#16a34a; text-align:center; margin-bottom:20px; }
    label { display:block; margin-top:10px; }
    input, textarea { width:100%; padding:8px; margin-top:5px; border-radius:5px; border:1px solid #333; background:#1a1a1a; color:#fff; }
    button { margin-top:15px; padding:10px 20px; background:#14521a; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold; transition: background 0.3s; }
    button:hover { background:#1e7f2e; }
    footer { margin-top:40px; font-size:14px; opacity:0.8; border-top:1px solid #333; padding-top:20px; text-align:center; }
    footer a { color:#16a34a; text-decoration:underline; margin:0 10px; }
  </style>
</head>
<body>

<h1>Submit a Quote / Apply for Job</h1>

<form id="quoteForm"
      action="https://formsubmit.co/virtualonlinenz@gmail.com"
      method="POST"
      enctype="multipart/form-data">
  <input type="hidden" name="_subject" value="Immediate Painters Enquiry">
<input type="hidden" name="_next" value="https://jobsnz.online/thankyou.html">
  <label for="jobid">Job ID*</label>
  <input type="text" id="jobid" name="jobid" required>

  <label for="name">Your Name*</label>
  <input type="text" id="name" name="name" required>

  <label for="email">Email*</label>
  <input type="email" id="email" name="email" required>

  <label for="quote">Quote Amount (NZD)*</label>
  <input type="number" id="quote" name="quote" required>

  <label for="notes">Notes / Details</label>
  <textarea id="notes" name="notes" rows="4"></textarea>

  <label for="files">Attach Files (optional)</label>
  <input type="file" name="files[]" multiple>

  <button type="submit">Submit Quote</button>
</form>

<div id="message" style="margin-top:20px;"></div>

<script>
document.getElementById('quoteForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const formData = new FormData(this);

  // Pre-fill job ID from URL if present
  const urlParams = new URLSearchParams(window.location.search);
  if(urlParams.has('jobid')) formData.set('jobid', urlParams.get('jobid'));

  try {
    const res = await fetch('send-quote.php', { method: 'POST', body: formData });
    const result = await res.text();
    document.getElementById('message').innerHTML = result;
    this.reset();
  } catch(err) {
    document.getElementById('message').innerHTML = "Error submitting quote.";
    console.error(err);
  }
});
</script>

<footer>
  <a href="index.html">Back to Immediate Painters Home</a> |
  <a href="../index.html">Back to JobsNZ Home</a>
</footer>

</body>
</html>
