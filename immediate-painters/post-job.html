<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post a Painting Job | Immediate Painters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial,sans-serif; max-width:1100px; margin:0 auto; padding:20px; background:#0f0f0f; color:#fff; }
    h1 { color:#16a34a; text-align:center; margin-bottom:20px; }
    label { display:block; margin-top:10px; }
    input, textarea { width:100%; padding:8px; margin-top:5px; border-radius:5px; border:1px solid #333; background:#1a1a1a; color:#fff; }
    button { margin-top:15px; padding:10px 20px; background:#14521a; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold; transition: background 0.3s; }
    button:hover { background:#1e7f2e; }
    footer { margin-top:40px; font-size:14px; opacity:0.8; border-top:1px solid #333; padding-top:20px; text-align:center; }
    footer a { color:#16a34a; text-decoration:underline; margin:0 10px; }
  </style>
</head>
<body>

<h1>Post a Painting Job</h1>

<form id="jobForm">
  <label for="title">Job Title*</label>
  <input type="text" id="title" name="title" required>

  <label for="location">Location*</label>
  <input type="text" id="location" name="location" required>

  <label for="budget">Budget (NZD)*</label>
  <input type="number" id="budget" name="budget" required>

  <label for="description">Description*</label>
  <textarea id="description" name="description" rows="5" required></textarea>

  <button type="submit">Submit Job</button>
</form>

<div id="message" style="margin-top:20px;"></div>

<script>
document.getElementById('jobForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const formData = new FormData(this);

  try {
    const res = await fetch('send-quote.php', {
      method: 'POST',
      body: formData
    });

    const result = await res.text();
    document.getElementById('message').innerHTML = result;
    this.reset();

  } catch(err) {
    document.getElementById('message').innerHTML = "Error submitting job.";
    console.error(err);
  }
});
</script>

<footer>
  <a href="index.html">Back to Immediate Painters Home</a> |
  <a href="../index.html">Back to JobNZ Home</a>
</footer>

</body>
</html>
