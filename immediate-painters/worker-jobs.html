<!DOCTYPE html>
<html>
<head>
  <title>Available Painting Jobs – Immediate Painters</title>
</head>
<body>

  <h2>Available Painting Jobs</h2>

  <div id="approvedPaintingJobs"></div>

  <script>
  function escapeHTML(value) {
    if (!value) return "";

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function loadApprovedPaintingJobs() {

    const container =
      document.getElementById("approvedPaintingJobs");

    const jobs =
      JSON.parse(
        localStorage.getItem("paintingJobListings")
      ) || [];

    const approvedJobs =
      jobs.filter(job => job.status === "APPROVED");

    container.innerHTML = "";

    if (approvedJobs.length === 0) {
      container.innerHTML =
        "<p>No approved painting jobs are currently available.</p>";
      return;
    }

    approvedJobs.forEach(job => {

      const listing =
        document.createElement("div");

      listing.style.marginBottom = "25px";

      listing.innerHTML = `
        <h3>${escapeHTML(job.jobTitle)}</h3>

        <p>
          <strong>Location:</strong>
          ${escapeHTML(job.jobLocation || "Not supplied")}
        </p>

        <p>
          <strong>Budget:</strong>
          NZ$${escapeHTML(job.budget || "Not supplied")}
        </p>

        <p>
          ${escapeHTML(job.jobDescription)}
        </p>

        <p>
          <strong>Contact:</strong>
          <a href="mailto:${escapeHTML(job.contactEmail)}">
            ${escapeHTML(job.contactEmail)}
          </a>
        </p>

        <p>
          <a href="quote.html?jobid=${job.id}">
            Submit a Quote / Apply
          </a>
        </p>

        <hr>
      `;

      container.appendChild(listing);

    });

  }

  loadApprovedPaintingJobs();
  </script>

</body>
</html>
