<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post an Odd Job – Odd Jobs NZ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
    }
    h2 {
      text-align: center;
      margin-top: 30px;
      color: #2c3e50;
    }
    .form-container {
      background-color: #ffffff;
      margin: 20px auto;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    label {
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    .submit-btn {
      background-color: #27ae60;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #2ecc71;
    }
  </style>
</head>
<body>

  <h2>Post Your Odd Job Listing</h2>

  <div class="form-container">
    <form id="job-form">
      <label for="job-title">Job Title</label>
      <input type="text" id="job-title" name="job-title" required>

      <label for="job-description">Job Description</label>
      <textarea id="job-description" name="job-description" rows="4" required></textarea>

      <label for="contact-email">Your Contact Email</label>
      <input type="email" id="contact-email" name="contact-email" required>

      <label for="contact-phone">Your Contact Phone</label>
      <input type="text" id="contact-phone" name="contact-phone" required>

      <button type="submit" class="submit-btn">Submit Job</button>
    </form>
  </div>

  <script>
    // JavaScript to handle form submission
    document.getElementById('job-form').addEventListener('submit', function(event) {
      event.preventDefault();

      // Collect form values
      const jobTitle = document.getElementById('job-title').value;
      const jobDescription = document.getElementById('job-description').value;
      const contactEmail = document.getElementById('contact-email').value;
      const contactPhone = document.getElementById('contact-phone').value;

      // Create a job listing object
      const jobListing = { jobTitle, jobDescription, contactEmail, contactPhone };

      // Get existing jobs from localStorage or create an empty array
      let jobListings = JSON.parse(localStorage.getItem('jobListings')) || [];

      // Add the new job to the array
      jobListings.push(jobListing);

      // Save the updated job listings array back to localStorage
      localStorage.setItem('jobListings', JSON.stringify(jobListings));

      // Notify the user that the job listing was submitted
      alert('Your job listing has been submitted!');

      // Optionally, reset the form
      document.getElementById('job-form').reset();
    });
  </script>

</body>
</html>
