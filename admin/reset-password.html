<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset JobsNZ Admin Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 60px auto;
      background: white;
      padding: 28px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      margin-top: 6px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #6f42c1;
      color: white;
      font-size: 16px;
    }

    .message {
      margin-top: 18px;
      font-weight: bold;
    }

    .success {
      color: #198754;
    }

    .error {
      color: #dc3545;
    }

    .info {
      color: #555;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Reset JobsNZ Admin Password</h1>

  <p class="info">
    Enter your new JobsNZ administration password below.
  </p>

  <form id="resetForm">

    <label for="newPassword">
      New Password
    </label>

    <input
      type="password"
      id="newPassword"
      required
      minlength="8"
      autocomplete="new-password"
    >

    <label for="confirmPassword">
      Confirm New Password
    </label>

    <input
      type="password"
      id="confirmPassword"
      required
      minlength="8"
      autocomplete="new-password"
    >

    <button type="submit">
      Update Password
    </button>

  </form>

  <div id="message" class="message"></div>

</div>

<script>

const SUPABASE_URL =
  "https://rfukmsuhbetdeudqtsxo.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Jn-Y_0f-Zz-Y4MEV4nJlgQ_hPvD7ZV2";

const jobsNZSupabase =sb_publishable_Jn-Y_0f-Zz-Y4MEV4nJlgQ_hPvD7ZV2
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function prepareRecoverySession() {

  const message =
    document.getElementById("message");

  /*
    Supabase recovery links may return either:
    - access_token / refresh_token in the URL hash
    - code in the query string
  */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const code =
    params.get("code");

  if (code) {

    const { error } =
      await jobsNZSupabase.auth
        .exchangeCodeForSession(code);

    if (error) {

      console.error(
        "Recovery code error:",
        error
      );

      message.textContent =
        "The password reset link is invalid or has expired.";

      message.className =
        "message error";

      return false;
    }

    return true;
  }


  const hash =
    new URLSearchParams(
      window.location.hash.substring(1)
    );

  const accessToken =
    hash.get("access_token");

  const refreshToken =
    hash.get("refresh_token");

  if (accessToken && refreshToken) {

    const { error } =
      await jobsNZSupabase.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });

    if (error) {

      console.error(
        "Recovery session error:",
        error
      );

      message.textContent =
        "The password reset session could not be verified.";

      message.className =
        "message error";

      return false;
    }

    return true;
  }


  const {
    data: { session }
  } =
    await jobsNZSupabase.auth.getSession();

  if (session) {
    return true;
  }


  message.textContent =
    "No password recovery session was found. Please use the password reset link sent to your email.";

  message.className =
    "message error";

  return false;
}


document
  .getElementById("resetForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const message =
        document.getElementById("message");

      message.textContent =
        "Updating password...";

      message.className =
        "message";


      const newPassword =
        document
          .getElementById("newPassword")
          .value;

      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      if (
        newPassword.length < 8
      ) {

        message.textContent =
          "Password must be at least 8 characters.";

        message.className =
          "message error";

        return;
      }


      if (
        newPassword !== confirmPassword
      ) {

        message.textContent =
          "The passwords do not match.";

        message.className =
          "message error";

        return;
      }


      const sessionReady =
        await prepareRecoverySession();

      if (!sessionReady) {
        return;
      }


      const { error } =
        await jobsNZSupabase.auth
          .updateUser({
            password: newPassword
          });


      if (error) {

        console.error(
          "Password update error:",
          error
        );

        message.textContent =
          "Password could not be updated. The recovery link may have expired.";

        message.className =
          "message error";

        return;
      }


      message.textContent =
        "Password updated successfully. You can now sign in to the JobsNZ admin pages.";

      message.className =
        "message success";


      document
        .getElementById("resetForm")
        .reset();
    }
  );

</script>

</body>
</html>
