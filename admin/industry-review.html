<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JobsNZ Industry Membership Review</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    h2 {
      clear: both;
      margin-top: 30px;
    }

    .subtext {
      margin-bottom: 20px;
      color: #555;
    }

    .login-box,
    .membership-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;

    }

    .awaiting-card {
      border-left: 6px solid #6f42c1;
    }

    input {
      width: 100%;

      padding: 10px;

    }

    button {
      padding: 10px 16px;

      cursor: pointer;
      margin-right: 8px;

    }

    .approve-btn {
      background: #198754;
      color: white;
    }

    .reject-btn {
      background: #dc3545;
      color: white;

    .activate-btn {
      background: #198754;
      color: white;

    }

    .copy-btn {
      background: #6f42c1;
      color: white;
    }

    .logout-btn {
      background: #333;
      color: white;
      float: right;
    }

    .refresh-btn {
      background: #6f42c1;
      color: white;
    }

    .field {
      margin-bottom: 8px;
    }

    .label {
      font-weight: bold;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;

      margin-bottom: 12px;
    }

      display: inline-block;

      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      white-space: pre-wrap;
    }

    .warning-box {
      background: #fff3cd;
      border: 1px solid #ffe69c;
      border-radius: 8px;
      padding: 12px;
      margin: 15px 0;
    }

    .message {
      margin: 15px 0;
      font-weight: bold;
    }

    a {
      color: #6f42c1;
    }

    hr {
      border: 0;
      border-top: 1px solid #ddd;
      margin: 18px 0;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>JobsNZ Industry Membership Review</h1>
  <p class="subtext">
    PūtaiaoTech / VOCC - JobsNZ Administration
  </p>

  <!-- ADMIN LOGIN -->

  <div id="loginBox" class="login-box">

    <h2>Admin Login</h2>

    <label>Email</label>
    <input type="email" id="email">

    <label>Password</label>
    <input type="password" id="password">

    <button onclick="adminLogin()">Login</button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- ADMIN PANEL -->

  <div id="adminPanel" style="display:none;">

    <button class="logout-btn" onclick="logout()">
      Logout
    </button>

    <h2>Pending Industry Membership Applications</h2>

    <button class="refresh-btn" onclick="loadAllMemberships()">
      Refresh Applications
    </button>

    <div id="adminMessage" class="message"></div>

    <div id="membershipList"></div>


    <h2>Approved — Awaiting Hnry Payment</h2>

    <p class="subtext">
      Confirm payment only after matching the JobsNZ Payment Reference
      against the payment details shown in Hnry.
    </p>

    <div id="paymentMessage" class="message"></div>

    <div id="awaitingPaymentList"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://rfukmsuhbetdeudqtsxo.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Jn-Y_0f-Zz-Y4MEV4nJlgQ_hPvD7ZV2";

const jobsNZSupabase =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ADMIN_EMAIL =
  "virtualonlinenz@gmail.com";


/* =========================================================
   ADMIN LOGIN
========================================================= */

async function adminLogin() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const loginMessage =
    document.getElementById("loginMessage");

  loginMessage.textContent =
    "Logging in...";

  const { data, error } =
    await jobsNZSupabase.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {

    console.error(error);

    loginMessage.textContent =
      "Login failed. Please check your details.";

    return;
  }

  if (
    !data.user ||
    data.user.email.toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
  ) {

    await jobsNZSupabase.auth.signOut();

    loginMessage.textContent =
      "This account is not authorised for JobsNZ administration.";

    return;
  }

  loginMessage.textContent = "";

  showAdminPanel();

  await loadAllMemberships();
}


/* =========================================================
   EXISTING SESSION
========================================================= */

async function checkExistingSession() {

  const {
    data: { session }
  } =
    await jobsNZSupabase.auth.getSession();

  if (
    session &&
    session.user &&
    session.user.email.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase()
  ) {

    showAdminPanel();

    await loadAllMemberships();
  }
}


function showAdminPanel() {

  document.getElementById("loginBox").style.display =
    "none";

  document.getElementById("adminPanel").style.display =
    "block";
}


/* =========================================================
   LOAD BOTH ADMIN SECTIONS
========================================================= */

async function loadAllMemberships() {

  await loadMemberships();

  await loadAwaitingPayments();
}


/* =========================================================
   PENDING MEMBERSHIP APPLICATIONS
========================================================= */

async function loadMemberships() {

  const membershipList =
    document.getElementById("membershipList");

  const adminMessage =
    document.getElementById("adminMessage");

  membershipList.innerHTML = "";

  adminMessage.textContent =
    "Loading pending applications...";

  const { data, error } =
    await jobsNZSupabase
      .from("industry_memberships")
      .select("*")
      .eq("status", "PENDING_REVIEW")
      .order("submitted_at", { ascending: true });

  if (error) {

    console.error(
      "Industry membership load error:",
      error
    );

    adminMessage.textContent =
      "Could not load Industry Membership applications.";

    return;
  }

  adminMessage.textContent = "";

  if (!data || data.length === 0) {

    membershipList.innerHTML =
      "<p>No Industry Membership applications are currently pending review.</p>";

    return;
  }

  data.forEach(membership => {

    const card =
      document.createElement("div");

    card.className =
      "membership-card";

    const submittedDate =
      membership.submitted_at
        ? new Date(
            membership.submitted_at
          ).toLocaleString("en-NZ")
        : "Not recorded";

    const termsDate =
      membership.terms_accepted_at
        ? new Date(
            membership.terms_accepted_at
          ).toLocaleString("en-NZ")
        : "Not recorded";

    card.innerHTML = `

      <div class="status">
        ${escapeHtml(membership.status)}
      </div>

      <div class="field">
        <span class="label">Business:</span>
        ${escapeHtml(membership.business_name)}
      </div>

      <div class="field">
        <span class="label">Contact:</span>
        ${escapeHtml(membership.contact_name)}
      </div>

      <div class="field">
        <span class="label">Email:</span>
        ${escapeHtml(membership.contact_email)}
      </div>

      <div class="field">
        <span class="label">Phone:</span>
        ${escapeHtml(membership.contact_phone)}
      </div>

      <div class="field">
        <span class="label">Industry:</span>
        ${escapeHtml(membership.industry)}
      </div>

      <div class="field">
        <span class="label">Region:</span>
        ${escapeHtml(membership.region)}
      </div>

      <div class="field">
        <span class="label">NZBN:</span>
        ${escapeHtml(
          membership.nzbn || "Not supplied"
        )}
      </div>

      <div class="field">
        <span class="label">Website:</span>

        ${
          membership.website
            ? `<a
                 href="${escapeAttribute(membership.website)}"
                 target="_blank"
                 rel="noopener noreferrer">
                 ${escapeHtml(membership.website)}
               </a>`
            : "Not supplied"
        }

      </div>

      <div class="field">
        <span class="label">
          Business Description:
        </span><br>

        ${escapeHtml(membership.business_description)}
      </div>

      <hr>

      <div class="field">
        <span class="label">
          Legitimate Business Confirmed:
        </span>

        ${
          membership.legitimate_business_confirmed
            ? "Yes"
            : "No"
        }
      </div>

      <div class="field">
        <span class="label">
          Listing Review Acknowledged:
        </span>

        ${
          membership.listing_review_acknowledged
            ? "Yes"
            : "No"
        }
      </div>

      <div class="field">
        <span class="label">
          Terms Accepted:
        </span>

        ${
          membership.terms_accepted
            ? "Yes"
            : "No"
        }
      </div>

      <div class="field">
        <span class="label">
          Terms Accepted At:
        </span>

        ${termsDate}
      </div>

      <div class="field">
        <span class="label">
          Submitted:
        </span>

        ${submittedDate}
      </div>

      <div class="field">
        <span class="label">
          Membership Fee:
        </span>

        $${Number(
          membership.membership_fee
        ).toFixed(2)}
      </div>

      <div class="field">
        <span class="label">
          Included Job Listings:
        </span>

        ${membership.included_job_listings}
      </div>

      <div class="field">
        <span class="label">
          Additional Listing Fee:
        </span>

        $${Number(
          membership.additional_listing_fee
        ).toFixed(2)}
      </div>

      <button
        class="approve-btn"
        onclick="approveMembership('${membership.id}')">

        Approve

      </button>

      <button
        class="reject-btn"
        onclick="rejectMembership('${membership.id}')">

        Reject

      </button>
    `;

    membershipList.appendChild(card);
  });
}


/* =========================================================
   JOBSNZ PAYMENT REFERENCE
========================================================= */

function createPaymentReference(membershipId) {

  const year =
    new Date().getFullYear();

  const safeId =
    String(membershipId)
      .replace(/[^a-zA-Z0-9]/g, "")
      .toUpperCase();

  /*
    Reference belongs to JobsNZ.

    Hnry is the current payment channel,
    but the reference remains a JobsNZ
    business reference.
  */

  return (
    "JNZ-IND-" +
    year +
    "-" +
    safeId.substring(0, 10)
  );
}


/* =========================================================
   APPROVE APPLICATION
========================================================= */

async function approveMembership(id) {

  const confirmed = confirm(
    "Approve this Industry Membership application?\n\n" +
    "JobsNZ will create the applicant's Industry Member Code.\n\n" +
    "The membership will remain inactive until payment is confirmed."
  );

  if (!confirmed) {
    return;
  }

  const {
    data: { session }
  } = await jobsNZSupabase.auth.getSession();

  if (!session) {
    alert("Your admin session has expired.");
    return;
  }

  // Create ONE permanent JobsNZ Industry Member Code
  const cleanId = String(id)
    .replace(/[^a-zA-Z0-9]/g, "")
    .toUpperCase();

  const memberCode =
    "JNZ-IND-" + cleanId.slice(-10);

  const { error } = await jobsNZSupabase
    .from("industry_memberships")
    .update({
      status: "APPROVED_AWAITING_PAYMENT",
      reviewed_at: new Date().toISOString(),
      reviewed_by: session.user.email,
      member_code: memberCode
    })
    .eq("id", id)
    .eq("status", "PENDING_REVIEW");

  if (error) {

    console.error(
      "Industry membership approval error:",
      error
    );

    alert(
      "The Industry Membership application could not be approved.\n\n" +
      error.message
    );

    return;
  }

  alert(
    "Industry Membership approved.\n\n" +
    "Industry Member Code: " + memberCode + "\n\n" +
    "Status: APPROVED_AWAITING_PAYMENT\n\n" +
    "Use this same code as the Hnry payment reference."
  );

  await loadAllMemberships();
}
/* =========================================================
   APPROVED — AWAITING PAYMENT
========================================================= */

async function loadAwaitingPayments() {

  const awaitingPaymentList =
    document.getElementById(
      "awaitingPaymentList"
    );

  const paymentMessage =
    document.getElementById(
      "paymentMessage"
    );

  awaitingPaymentList.innerHTML = "";

  paymentMessage.textContent =
    "Loading memberships awaiting payment...";

  const { data, error } =
    await jobsNZSupabase
      .from("industry_memberships")
      .select("*")
      .eq(
        "status",
        "APPROVED_AWAITING_PAYMENT"
      )
      .order(
        "reviewed_at",
        { ascending: true }
      );

  if (error) {

    console.error(
      "Awaiting payment load error:",
      error
    );

    paymentMessage.textContent =
      "Could not load memberships awaiting payment.";

    return;
  }

  paymentMessage.textContent = "";

  if (!data || data.length === 0) {

    awaitingPaymentList.innerHTML =
      "<p>No approved Industry Memberships are currently awaiting payment.</p>";

    return;
  }

  data.forEach(membership => {

    const card =
      document.createElement("div");

    card.className =
      "membership-card awaiting-card";

    const paymentInstructions =
`Subject: JobsNZ Industry Membership Approved – Payment Required

Kia ora ${membership.contact_name},

Your application for JobsNZ Industry Membership for ${membership.business_name} has been approved, subject to receipt of the $${Number(membership.membership_fee).toFixed(2)} annual membership payment.

Membership fee: $${Number(membership.membership_fee).toFixed(2)} NZD

JobsNZ Payment Reference:
${membership.payment_reference}

When making payment, please use your JobsNZ Payment Reference exactly as shown above.

Once payment has been received and confirmed, JobsNZ will activate your membership and issue your Industry Member Code.

Your membership includes ${membership.included_job_listings} approved job listing. Additional approved job listings are $${Number(membership.additional_listing_fee).toFixed(2)} each.

All job listings are reviewed before publication.

Ngā mihi,

VOCC – JobsNZ Administration
PūtaiaoTech`;

    card.innerHTML = `

      <div class="status">
        APPROVED — AWAITING PAYMENT
      </div>

      <div class="field">
        <span class="label">Business:</span>
        ${escapeHtml(membership.business_name)}
      </div>

      <div class="field">
        <span class="label">Contact:</span>
        ${escapeHtml(membership.contact_name)}
      </div>

      <div class="field">
        <span class="label">Email:</span>
        ${escapeHtml(membership.contact_email)}
      </div>

      <div class="field">
        <span class="label">Membership Fee:</span>
        $${Number(
          membership.membership_fee
        ).toFixed(2)}
      </div>

      <div class="field">
        <span class="label">
          JobsNZ Payment Reference:
        </span><br>

        <div class="payment-reference">
          ${escapeHtml(
            membership.payment_reference ||
            "REFERENCE NOT RECORDED"
          )}
        </div>
      </div>

      <div class="payment-box">${escapeHtml(
        paymentInstructions
      )}</div>

      <button
        class="copy-btn"
        onclick="copyPaymentInstructions('${membership.id}')">

        Copy Approval / Payment Message

      </button>

      <div class="warning-box">

        <strong>Before activation:</strong><br>

        Open the Hnry Pay Summary and confirm
        that the payment belongs to this business
        and matches this JobsNZ Payment Reference.

      </div>

      <button
        class="activate-btn"
        onclick="confirmPaymentAndActivate('${membership.id}')">

        Confirm Payment &amp; Activate

      </button>

      <textarea
        id="paymentText-${membership.id}"
        style="display:none;">${escapeHtml(paymentInstructions)}</textarea>
    `;

    awaitingPaymentList.appendChild(card);
  });
}


/* =========================================================
   COPY PAYMENT MESSAGE
========================================================= */

async function copyPaymentInstructions(id) {

  const textarea =
    document.getElementById(
      "paymentText-" + id
    );

  if (!textarea) {

    alert(
      "Payment message could not be found."
    );

    return;
  }

  try {

    await navigator.clipboard.writeText(
      textarea.value
    );

    alert(
      "Approval and payment message copied."
    );

  } catch (error) {

    console.error(
      "Clipboard error:",
      error
    );

    textarea.style.display =
      "block";

    textarea.select();

    alert(
      "Automatic copy was unavailable. " +
      "The message has been selected for manual copying."
    );
  }
}


/* =========================================================
   MEMBER CODE
========================================================= */

function createMemberCode(membershipId) {

  const safeId =
    String(membershipId)
      .replace(/[^a-zA-Z0-9]/g, "")
      .toUpperCase();

  return (
    "JNZ-IND-" +
    safeId.slice(-10)
  );
}


/* =========================================================
   CONFIRM PAYMENT AND ACTIVATE
========================================================= */

async function confirmPaymentAndActivate(id) {

  const {
    data: { session }
  } =
    await jobsNZSupabase.auth.getSession();

  if (!session) {

    alert(
      "Your admin session has expired."
    );

    return;
  }

  /*
    Read the membership again immediately
    before activation.
  */

  const {
    data: membership,
    error: membershipError
  } =
    await jobsNZSupabase
      .from("industry_memberships")
      .select("*")
      .eq("id", id)
      .eq(
        "status",
        "APPROVED_AWAITING_PAYMENT"
      )
      .single();

  if (
    membershipError ||
    !membership
  ) {

    console.error(
      "Membership verification error:",
      membershipError
    );

    alert(
      "This membership could not be verified " +
      "for payment activation."
    );

    return;
  }

  if (!membership.payment_reference) {

    alert(
      "STOP: This membership does not have " +
      "a JobsNZ Payment Reference."
    );

    return;
  }

  const confirmed =
    confirm(
      "CONFIRM PAYMENT\n\n" +

      "Business:\n" +
      membership.business_name +

      "\n\nAmount:\n$" +
      Number(
        membership.membership_fee
      ).toFixed(2) +

      "\n\nJobsNZ Payment Reference:\n" +
      membership.payment_reference +

      "\n\nHave you checked the Hnry Pay Summary " +
      "and confirmed that this payment matches " +
      "the business and JobsNZ Payment Reference?"
    );

  if (!confirmed) {
    return;
  }

  const secondConfirmation =
    confirm(
      "Activate this Industry Membership now?\n\n" +
      "This will issue the Industry Member Code " +
      "and set the membership to ACTIVE."
    );

  if (!secondConfirmation) {
    return;
  }

  const now =
    new Date();

  const expiry =
    new Date(now);

  /*
    Annual membership:
    expires one calendar year from activation.
  */

  expiry.setFullYear(
    expiry.getFullYear() + 1
  );

  const memberCode =
    createMemberCode(id);

  const { error } =
    await jobsNZSupabase
      .from("industry_memberships")
      .update({

        payment_confirmed_at:
          now.toISOString(),

        payment_confirmed_by:
          session.user.email,

        activated_at:
          now.toISOString(),

        expires_at:
          expiry.toISOString(),

        member_code:
          memberCode,

        status:
          "ACTIVE"

      })
      .eq("id", id)
      .eq(
        "status",
        "APPROVED_AWAITING_PAYMENT"
      );

  if (error) {

    console.error(
      "Membership activation error:",
      error
    );

    alert(
      "Payment was NOT recorded and the " +
      "membership was NOT activated.\n\n" +
      "Please check the error before trying again."
    );

    return;
  }

  alert(
    "INDUSTRY MEMBERSHIP ACTIVATED ✔\n\n" +

    "Business:\n" +
    membership.business_name +

    "\n\nMember Code:\n" +
    memberCode +

    "\n\nStatus: ACTIVE\n\n" +

    "The membership expires one year " +
    "from today's activation date."
  );

  await loadAllMemberships();
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

  await jobsNZSupabase.auth.signOut();

  document.getElementById(
    "adminPanel"
  ).style.display =
    "none";

  document.getElementById(
    "loginBox"
  ).style.display =
    "block";

  document.getElementById(
    "membershipList"
  ).innerHTML =
    "";

  document.getElementById(
    "awaitingPaymentList"
  ).innerHTML =
    "";
}


/* =========================================================
   SECURITY / DISPLAY HELPERS
========================================================= */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function escapeAttribute(value) {

  return escapeHtml(value);
}


/* =========================================================
   START
========================================================= */

checkExistingSession();

</script>

</body>
</html>
