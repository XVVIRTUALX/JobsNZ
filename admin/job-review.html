<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JobsNZ | Job Moderation</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#0a0f14;
  color:white;
  margin:0;
  padding:30px;
}

.container {
  max-width:1000px;
  margin:auto;
}

h1 {
  color:#4CAF50;
  text-align:center;
}

.panel,
.job-card {
  background:#111820;
  border:1px solid #27333d;
  border-radius:10px;
  padding:20px;
  margin-bottom:20px;
}

.status {
  display:inline-block;
  background:#d97706;
  padding:5px 10px;
  border-radius:5px;
  font-weight:bold;
}

input,
textarea {
  width:100%;
  box-sizing:border-box;
  padding:10px;
  margin:8px 0 15px;
}

button {
  padding:10px 15px;
  margin:5px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}

.approve {
  background:#2e9e36;
  color:white;
}

.changes {
  background:#d97706;
  color:white;
}

.reject {
  background:#b91c1c;
  color:white;
}

.login {
  background:#2e9e36;
  color:white;
}

.logout {
  background:#555;
  color:white;
}

a {
  color:#4CAF50;
}

.hidden {
  display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>JobsNZ Job Moderation</h1>

<!-- ADMIN LOGIN -->
<div id="loginPanel" class="panel">

  <h2>Admin Login</h2>

  <p>
    Sign in to access the JobsNZ moderation queue.
  </p>

  <label>Email</label>
  <input
    type="email"
    id="adminEmail"
    value="virtualonlinenz@gmail.com"
  >

  <label>Password</label>
  <input
    type="password"
    id="adminPassword"
  >

  <button
    class="login"
    onclick="adminLogin()">
    Sign In
  </button>

  <p id="loginMessage"></p>

</div>


<!-- MODERATION DASHBOARD -->
<div id="moderationPanel" class="hidden">

  <div class="panel">

    <strong>Moderation Queue</strong>

    <p>
      Submitted listings remain unpublished until
      approved by JobsNZ.
    </p>

    <button
      class="logout"
      onclick="adminLogout()">
      Sign Out
    </button>

  </div>

  <div id="pendingJobs"></div>

</div>


<p style="text-align:center;">
<a href="../index.html">Return to JobsNZ</a>
</p>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://rfukmsuhbetdeudqtsxo.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Jn-Y_0f-Zz-Y4MEV4nJlgQ_hPvD7ZV2";

const jobsNZSupabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


async function adminLogin() {

  const email =
    document.getElementById("adminEmail").value.trim();

  const password =
    document.getElementById("adminPassword").value;

  const { error } =
    await jobsNZSupabase.auth.signInWithPassword({
      email,
      password
    });

  if (error) {

    document.getElementById("loginMessage")
      .textContent =
      "Login failed. Check your email and password.";

    console.error(error);

    return;
  }

  document.getElementById("loginMessage")
    .textContent = "";

  showModerationDashboard();

}


async function adminLogout() {

  await jobsNZSupabase.auth.signOut();

  document
    .getElementById("moderationPanel")
    .classList.add("hidden");

  document
    .getElementById("loginPanel")
    .classList.remove("hidden");

}


async function showModerationDashboard() {

  document
    .getElementById("loginPanel")
    .classList.add("hidden");

  document
    .getElementById("moderationPanel")
    .classList.remove("hidden");

  await loadPendingJobs();

}


async function loadPendingJobs() {

  const container =
    document.getElementById("pendingJobs");

  container.innerHTML =
    "<p>Loading moderation queue...</p>";

  const { data: jobs, error } =
    await jobsNZSupabase
      .from("jobs")
      .select("*")
      .eq("status", "PENDING_REVIEW")
      .order("submitted_at", {
        ascending: true
      });


  if (error) {

    console.error(
      "Moderation loading error:",
      error
    );

    container.innerHTML =
      "<p>Unable to load moderation queue.</p>";

    return;
  }


  container.innerHTML = "";


  if (!jobs || jobs.length === 0) {

    container.innerHTML =
      '<div class="panel">No job listings are currently awaiting review.</div>';

    return;
  }


  jobs.forEach(job => {

    const card =
      document.createElement("div");

    card.className = "job-card";


    const marketplaceName =
      job.marketplace === "IMMEDIATE_PAINTERS"
        ? "Immediate Painters"
        : "Odd-Jobs NZ";


    const budgetDisplay =
      job.budget
        ? `<p><strong>Budget:</strong>
           NZ$${escapeHTML(job.budget)}</p>`
        : "";


    card.innerHTML = `

      <div class="status">
        PENDING REVIEW
      </div>

      <p>
        <strong>Marketplace:</strong>
        ${escapeHTML(marketplaceName)}
      </p>

      <h2>
        ${escapeHTML(job.job_title)}
      </h2>

      <p>
        <strong>Description:</strong><br>
        ${escapeHTML(job.job_description)}
      </p>

      <p>
        <strong>Location:</strong>
        ${escapeHTML(job.job_location)}
      </p>

      ${budgetDisplay}

      <p>
        <strong>Contact Email:</strong>
        ${escapeHTML(job.contact_email)}
      </p>

      <p>
        <strong>Contact Phone:</strong>
        ${escapeHTML(job.contact_phone || "Not supplied")}
      </p>

      <p>
        <strong>Submitted:</strong>
        ${formatDate(job.submitted_at)}
      </p>

      <label>
        <strong>Review Notes</strong>
      </label>

      <textarea
        id="notes-${job.id}"
        placeholder="Add moderation notes if required..."
      ></textarea>

      <button
        class="approve"
        onclick="reviewJob(
          '${job.id}',
          'APPROVED'
        )">
        ✓ Approve
      </button>

      <button
        class="changes"
        onclick="reviewJob(
          '${job.id}',
          'NEEDS_CHANGES'
        )">
        Needs Changes
      </button>

      <button
        class="reject"
        onclick="reviewJob(
          '${job.id}',
          'REJECTED'
        )">
        ✗ Reject
      </button>
    `;

    container.appendChild(card);

  });

}


async function reviewJob(id, decision) {

  const notes =
    document
      .getElementById(`notes-${id}`)
      .value;


  const { error } =
    await jobsNZSupabase
      .from("jobs")
      .update({

        status: decision,

        review_notes: notes,

        reviewed_by:
          "JobsNZ Admin",

        reviewed_at:
          new Date().toISOString()

      })
      .eq("id", id);


  if (error) {

    console.error(
      "Moderation update error:",
      error
    );

    alert(
      "Unable to update this job listing."
    );

    return;
  }


  if (decision === "APPROVED") {

    alert(
      "Job approved for publication."
    );

  }

  if (decision === "NEEDS_CHANGES") {

    alert(
      "Job marked as needing changes."
    );

  }

  if (decision === "REJECTED") {

    alert(
      "Job listing rejected."
    );

  }


  await loadPendingJobs();

}


function escapeHTML(value) {

  if (value === null ||
      value === undefined) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function formatDate(value) {

  if (!value) {
    return "Unknown";
  }

  return new Date(value)
    .toLocaleString();

}


async function checkExistingSession() {

  const {
    data: { session }
  } =
    await jobsNZSupabase.auth
      .getSession();


  if (session) {

    showModerationDashboard();

  }

}


checkExistingSession();

</script>

</body>
</html>
