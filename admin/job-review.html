<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JobsNZ | Job Moderation</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0a0f14;
      color: #ffffff;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      color: #4CAF50;
      text-align: center;
    }

    .notice {
      background: #151b21;
      border: 1px solid #39434c;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
    }

    .job-card {
      background: #111820;
      border: 1px solid #27333d;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .job-card h2 {
      margin-top: 0;
      color: #ffffff;
    }

    .status {
      display: inline-block;
      background: #d97706;
      padding: 5px 10px;
      border-radius: 5px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 70px;
      margin-top: 8px;
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #444;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .approve {
      background: #2e9e36;
      color: white;
    }

    .changes {
      background: #d97706;
      color: white;
    }

    .reject {
      background: #b91c1c;
      color: white;
    }

    .empty {
      text-align: center;
      padding: 30px;
      background: #111820;
      border-radius: 8px;
    }

    a {
      color: #4CAF50;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>JobsNZ Job Moderation</h1>

  <div class="notice">
    <strong>Moderation Queue</strong>
    <p>
      Job listings remain unpublished until they have been reviewed
      and approved by JobsNZ.
    </p>
  </div>

  <div id="pendingJobs"></div>

  <p style="text-align:center;">
    <a href="../index.html">Return to JobsNZ</a>
  </p>

</div>

<script>

function loadPendingJobs() {

  const container = document.getElementById("pendingJobs");

  const jobs =
    JSON.parse(localStorage.getItem("jobListings")) || [];

  const pendingJobs =
    jobs.filter(job => job.status === "PENDING_REVIEW");

  container.innerHTML = "";

  if (pendingJobs.length === 0) {

    container.innerHTML =
      '<div class="empty">No job listings are currently awaiting review.</div>';

    return;
  }

  pendingJobs.forEach(job => {

    const card = document.createElement("div");
    card.className = "job-card";

    card.innerHTML = `
      <div class="status">PENDING REVIEW</div>

      <h2>${escapeHTML(job.jobTitle)}</h2>

      <p><strong>Description:</strong><br>
      ${escapeHTML(job.jobDescription)}</p>

      <p><strong>Location:</strong>
      ${escapeHTML(job.jobLocation || "Not supplied")}</p>

      <p><strong>Contact Email:</strong>
      ${escapeHTML(job.contactEmail)}</p>

      <p><strong>Contact Phone:</strong>
      ${escapeHTML(job.contactPhone)}</p>

      <p><strong>Submitted:</strong>
      ${formatDate(job.submittedAt)}</p>

      <label>
        <strong>Review Notes</strong>
      </label>

      <textarea
        id="notes-${job.id}"
        placeholder="Add moderation notes if required..."
      ></textarea>

      <button
        class="approve"
        onclick="reviewJob(${job.id}, 'APPROVED')">
        ✓ Approve
      </button>

      <button
        class="changes"
        onclick="reviewJob(${job.id}, 'NEEDS_CHANGES')">
        Needs Changes
      </button>

      <button
        class="reject"
        onclick="reviewJob(${job.id}, 'REJECTED')">
        ✗ Reject
      </button>
    `;

    container.appendChild(card);

  });
}


function reviewJob(id, decision) {

  const jobs =
    JSON.parse(localStorage.getItem("jobListings")) || [];

  const jobIndex =
    jobs.findIndex(job => job.id === id);

  if (jobIndex === -1) {
    alert("Job listing could not be found.");
    return;
  }

  const notes =
    document.getElementById(`notes-${id}`).value;

  jobs[jobIndex].status = decision;
  jobs[jobIndex].reviewNotes = notes;
  jobs[jobIndex].reviewedBy = "JobsNZ Admin";
  jobs[jobIndex].reviewedAt = new Date().toISOString();

  if (decision === "APPROVED") {
    jobs[jobIndex].approvedAt =
      new Date().toISOString();
  }

  localStorage.setItem(
    "jobListings",
    JSON.stringify(jobs)
  );

  if (decision === "APPROVED") {
    alert("Job approved for publication.");
  }

  if (decision === "NEEDS_CHANGES") {
    alert("Job marked as needing changes.");
  }

  if (decision === "REJECTED") {
    alert("Job listing rejected.");
  }

  loadPendingJobs();
}


function escapeHTML(value) {

  if (!value) return "";

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function formatDate(value) {

  if (!value) return "Unknown";

  return new Date(value).toLocaleString();
}


loadPendingJobs();

</script>

</body>
</html>
