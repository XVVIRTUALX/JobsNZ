<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JobsNZ Admin Password Recovery</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 60px auto;
      background: white;
      padding: 28px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    h1 {
      margin-top: 0;
    }

    .info {
      color: #555;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      margin-top: 6px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #6f42c1;
      color: white;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    .success {
      color: #198754;
    }

    .error {
      color: #dc3545;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>JobsNZ Admin Password Recovery</h1>

  <p class="info">
    Request a password recovery email for the JobsNZ
    administration account.
  </p>

  <form id="recoveryForm">

    <label for="adminEmail">
      Admin Email
    </label>

    <input
      type="email"
      id="adminEmail"
      value="virtualonlinenz@gmail.com"
      required
      autocomplete="email"
    >

    <button
      type="submit"
      id="resetButton">
      Send Password Reset Email
    </button>

  </form>

  <div id="message" class="message"></div>

</div>


<script>

const SUPABASE_URL =
  "https://rfukmsuhbetdeudqtsxo.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Jn-Y_0f-Zz-Y4MEV4nJlgQ_hPvD7ZV2";

const jobsNZSupabase =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


document
  .getElementById("recoveryForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const email =
        document
          .getElementById("adminEmail")
          .value
          .trim();

      const message =
        document.getElementById("message");

      const resetButton =
        document.getElementById("resetButton");


      if (
        email.toLowerCase() !==
        "virtualonlinenz@gmail.com"
      ) {

        message.textContent =
          "This page is restricted to the JobsNZ administration account.";

        message.className =
          "message error";

        return;
      }


      resetButton.disabled = true;

      message.textContent =
        "Requesting password recovery email...";

      message.className =
        "message";


      const { error } =
        await jobsNZSupabase.auth
          .resetPasswordForEmail(
            email,
            {
              redirectTo:
                "https://jobsnz.online/admin/reset-password.html"
            }
          );


      if (error) {

        console.error(
          "JobsNZ password recovery error:",
          error
        );

        message.textContent =
          "Password recovery request failed. Please try again.";

        message.className =
          "message error";

        resetButton.disabled = false;

        return;
      }


      message.textContent =
        "Password reset email requested successfully. Check the inbox for the JobsNZ admin email account and use the newest recovery email.";

      message.className =
        "message success";

      resetButton.disabled = false;
    }
  );

</script>

</body>
</html>
