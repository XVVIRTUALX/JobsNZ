<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JobsNZ | Odd Jobs NZ & More</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== GLOBAL ===== */
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #0a0f14, #05080c);
    color: #d9e1e8;
}

/* ===== MAIN WRAP ===== */
.container {
    max-width: 1200px;
    margin: auto;
    padding: 40px 20px;
}

/* ===== HEADER ===== */
.main-title {
    text-align: center;
    font-size: 38px;
    font-weight: bold;
    color: #4CAF50;
    margin-bottom: 25px;
}

/* ===== INTRO ===== */
.intro {
    text-align: center;
    max-width: 900px;
    margin: 0 auto 40px auto;
    line-height: 1.6;
    color: #c7d2db;
}

/* ===== GRID ===== */
.grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 30px;
}

/* ===== PANELS ===== */
.panel {
    background: linear-gradient(145deg, #0e141a, #0a0f14);
    border: 1px solid #1e2a33;
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 0 12px rgba(0,0,0,0.6);
}

.panel h2 {
    margin: 0 0 8px 0;
    font-size: 22px;
    color: #ffffff;
}

.panel p {
    margin: 0;
    color: #b8c4cc;
}

/* ===== CLIMATE PANEL CUSTOM COLORS ===== */
.panel-climate {
    background: linear-gradient(145deg, #5C4033, #8B5E3C); /* brown gradient */
    border: 1px solid #6B4C3A;
}

.panel-climate h2 {
    color: #D1E231; /* bright green text */
}

.panel-climate p {
    color: #e2e6d0;
}

/* ===== BUTTON ===== */
.btn {
    float: right;
    background: linear-gradient(180deg, #5edb63, #2e9e36);
    color: white;
    padding: 10px 22px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 0 8px rgba(0,0,0,0.5);
    transition: 0.2s;
}

.btn:hover {
    background: linear-gradient(180deg, #6fff73, #35b63f);
}

/* ===== RIGHT BOX ===== */
.side-box {
    background: linear-gradient(145deg, #0e141a, #0a0f14);
    border: 1px solid #1e2a33;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 18px;
    text-align: center;
    box-shadow: 0 0 12px rgba(0,0,0,0.6);
}

.side-box h3 {
    margin-top: 0;
    color: #ffffff;
}

/* ===== TWO‑COLUMN LAYOUT ===== */
.homepage-container {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
}

.left-column {
    flex: 2;
    min-width: 300px;
}

.right-column {
    flex: 1;
    min-width: 250px;
}

/* MOBILE */
@media (max-width: 900px) {
    .homepage-container {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="main-title">
