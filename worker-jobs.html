<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Available Jobs – JobsNZ</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #5b2c83;
    }

    .intro {
      text-align: center;
      max-width: 750px;
      margin: 0 auto 25px;
    }

    .job-listing {
      background: white;
      margin: 20px auto;
      padding: 20px;
      border-radius: 8px;
      max-width: 700px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .marketplace {
      font-weight: bold;
      color: #5b2c83;
      margin-bottom: 8px;
    }

    .job-listing h2 {
      margin-top: 8px;
    }

    .contact-info {
      margin-top: 15px;
    }

    .apply-link {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 14px;
      background: #f4c430;
      color: #222;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

  </style>

</head>

<body>

<h1>Available Jobs</h1>

<p class="intro">
  Browse approved work opportunities currently available through JobsNZ.
</p>

<div id="approvedJobs">
  <p style="text-align:center;">
    Loading available jobs...
  </p>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://rfukmsuhbetdeudqtsxo.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Jn-Y_0f-Zz-Y4MEV4nJlgQ_hPvD7ZV2";

const jobsNZSupabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


function escapeHTML(value) {

  if (!value) return "";

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function getMarketplaceName(marketplace) {

  if (marketplace === "INDUSTRY") {
    return "JobsNZ Industry";
  }

  if (marketplace === "IMMEDIATE_PAINTERS") {
    return "Immediate Painters";
  }

  if (marketplace === "ODD_JOBS") {
    return "Odd Jobs NZ";
  }

  return marketplace || "JobsNZ";
}


async function loadApprovedJobs() {

  const container =
    document.getElementById("approvedJobs");


  const { data: jobs, error } =
    await jobsNZSupabase
      .from("jobs")
      .select(`
        id,
        marketplace,
        job_title,
        job_description,
        job_location,
        contact_email,
        published_at,
        expires_at
      `)
      .eq("status", "APPROVED")
      .gt(
        "expires_at",
        new Date().toISOString()
      )
      .order(
        "published_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "JobsNZ job loading error:",
      error
    );

    container.innerHTML =
      "<p style='text-align:center;'>Unable to load available jobs at this time.</p>";

    return;
  }


  container.innerHTML = "";


  if (!jobs || jobs.length === 0) {

    container.innerHTML =
      "<p style='text-align:center;'>No approved jobs are currently available.</p>";

    return;
  }


  jobs.forEach(job => {

    const listing =
      document.createElement("div");

    listing.className =
      "job-listing";


    const marketplaceName =
      getMarketplaceName(
        job.marketplace
      );


    listing.innerHTML = `

      <div class="marketplace">
        ${escapeHTML(marketplaceName)}
      </div>

      <h2>
        ${escapeHTML(job.job_title)}
      </h2>

      <p>
        <strong>Location:</strong>
        ${escapeHTML(job.job_location)}
      </p>

      <p>
        ${escapeHTML(job.job_description)}
      </p>

      <p class="contact-info">
        <strong>Contact:</strong>
        <a href="mailto:${escapeHTML(job.contact_email)}">
          ${escapeHTML(job.contact_email)}
        </a>
      </p>

      <a
        class="apply-link"
        href="mailto:${escapeHTML(job.contact_email)}?subject=${encodeURIComponent(
          "JobsNZ application - " + job.job_title
        )}"
      >
        Apply for this job
      </a>

    `;

    container.appendChild(
      listing
    );

  });

}


loadApprovedJobs();

</script>

</body>
</html>
