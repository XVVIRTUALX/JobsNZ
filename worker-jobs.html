<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Jobs – Odd Jobs NZ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
    }
    h2 {
      text-align: center;
      margin-top: 30px;
      color: #2c3e50;
    }
    .job-listing {
      background-color: #ffffff;
      margin: 20px auto;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .job-listing h3 {
      color: #27ae60;
    }
    .contact-info {
      color: #2980b9;
    }
  </style>
</head>
<body>

  <h2>Search Available Jobs</h2>

<div id="approvedJobs"></div>

<script>
function escapeHTML(value) {
  if (!value) return "";

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function loadApprovedJobs() {
  const container = document.getElementById("approvedJobs");

  const jobs =
    JSON.parse(localStorage.getItem("jobListings")) || [];

  const approvedJobs =
    jobs.filter(job => job.status === "APPROVED");

  container.innerHTML = "";

  if (approvedJobs.length === 0) {
    container.innerHTML =
      "<p>No approved jobs are currently available.</p>";
    return;
  }

  approvedJobs.forEach(job => {
    const listing = document.createElement("div");
    listing.className = "job-listing";

    listing.innerHTML = `
      <h3>${escapeHTML(job.jobTitle)} – ${escapeHTML(job.jobLocation || "")}</h3>

      <p>${escapeHTML(job.jobDescription)}</p>

      <p class="contact-info">
        Contact:
        <a href="mailto:${escapeHTML(job.contactEmail)}">
          ${escapeHTML(job.contactEmail)}
        </a>
      </p>

      <p>
        <a href="mailto:${escapeHTML(job.contactEmail)}?subject=JobsNZ application - ${encodeURIComponent(job.jobTitle)}">
          Apply for this job
        </a>
      </p>
    `;

    container.appendChild(listing);
  });
}

loadApprovedJobs();
</script>

</body>
</html>
